name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Uses the modern GitHub Pages deployment flow (actions/deploy-pages): the
# workflow gets a short-lived, scoped token via OIDC, so no long-lived
# personal access token or repo secret is needed for the deploy step
# itself. See docs/deployment.md for the one-time setup this requires
# (Settings -> Pages -> Source: "GitHub Actions").
permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time; a newer push cancels a stale one still
# building, but never cancels one already live-deploying.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm test

      - run: npm run build
        env:
          # These are Firebase's public web SDK config values (see
          # docs/firebase-schema.md — not secrets by design, security is
          # enforced by firestore.rules / database.rules.json instead),
          # but they still need to come from *this* repo's own Firebase
          # project rather than being hardcoded, so they're read from
          # repository secrets set up per docs/deployment.md.
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_DATABASE_URL: ${{ secrets.VITE_FIREBASE_DATABASE_URL }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
